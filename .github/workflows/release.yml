name: Release MuteUntil

# Push a tag such as v1.0.0 and this builds the APK and publishes it as a
# GitHub Release. Release assets live outside git history, so the repository
# stays small.
#
# Signing is optional. Without the secrets below the job still publishes, but
# the APK is unsigned and Android refuses to install it. To get a signed APK,
# create a keystore yourself and add four repository secrets:
#
#   keytool -genkey -v -keystore muteuntil.jks -alias muteuntil \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -i muteuntil.jks | pbcopy
#
#   KEYSTORE_BASE64    the clipboard contents from the line above
#   KEYSTORE_PASSWORD  the store password you chose
#   KEY_ALIAS          muteuntil
#   KEY_PASSWORD       the key password you chose
#
# Keep muteuntil.jks somewhere safe and out of this repository. Android only
# accepts an update signed by the same key that signed the install.

on:
  push:
    tags:
      - 'v*'
  # Manual run from the Actions tab, for when pushing a tag is inconvenient.
  # Give the version explicitly, or the release would be named after the branch.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MuteUntil

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This action installs "tools platform-tools" by default. Google removed the
      # legacy "tools" package from the SDK repository, so the default fails with
      # "Failed to find package 'tools'". Install nothing: the step is only here to
      # provide cmdline-tools and accept the licences. AGP then downloads the exact
      # platform it needs, which for compileSdk 37 is android-37.0.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew assembleRelease

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          OUT_DIR=app/build/outputs/apk/release
          UNSIGNED="$OUT_DIR/app-release-unsigned.apk"
          FINAL="$OUT_DIR/MuteUntil-$VERSION.apk"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. Publishing an UNSIGNED APK, which Android will refuse to install."
            cp "$UNSIGNED" "$FINAL"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then echo "No Android SDK on the runner"; exit 1; fi
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools at $BUILD_TOOLS"

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED" "$OUT_DIR/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$FINAL" \
            "$OUT_DIR/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"

          rm -f "$RUNNER_TEMP/keystore.jks" "$OUT_DIR/aligned.apk" "$FINAL.idsig"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          APK: ${{ steps.sign.outputs.apk }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -eu
          if [ "$SIGNED" = "true" ]; then
            NOTE="Signed APK. Copy it to your phone and open it, or run: adb install -r $(basename "$APK")"
          else
            NOTE="WARNING: this APK is unsigned and will not install. Add the signing secrets described in .github/workflows/release.yml, then re-run."
          fi
          # The release may already exist, for example when it was drafted on the
          # website. Attach to it in that case instead of failing.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Attaching the APK."
            gh release upload "$VERSION" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MuteUntil $VERSION" \
              --notes "$NOTE"
          fi
